[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'  ; Command to start Nginx
autostart=true                            ; Start Nginx on Supervisor start
autorestart=true                          ; Restart Nginx if it exits unexpectedly
stderr_logfile=/var/log/nginx/nginx-stderr.log  ; Log file for errors
stdout_logfile=/var/log/nginx/nginx-stdout.log  ; Log file for standard output
user=root                                ; User to run Nginx (use `www-data` for safety if required)
startretries=3                           ; Number of retries if Nginx fails to start
