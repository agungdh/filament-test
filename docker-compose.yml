services:
  fpm:
    build:
      context: .
      dockerfile: docker/fpm.Dockerfile
    container_name: app
    restart: always
    depends_on:
      - mariadb
      - redis
    volumes:
        - app_data:/var/www/html
  nginx:
    build:
      context: docker
      dockerfile: nginx.Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - fpm
    ports:
        - "80:80"
    volumes:
        - app_data:/var/www/html
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: admin
      MARIADB_DATABASE: filament
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin
    volumes:
      - mariadb_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: admin
      UPLOAD_LIMIT: 4000M
    ports:
      - "82:80"
    depends_on:
      - mariadb
  redis:
    image: redis
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
volumes:
  app_data:
  mariadb_data:
  redis_data:
